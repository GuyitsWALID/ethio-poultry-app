name: Platform monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-monitoring-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  production-probe:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    name: Production application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENVIRONMENT: production
      APP_RELEASE: ${{ github.sha }}
      APP_BASE_URL: https://ethio-poultry-app.walidmurad65.workers.dev
      MONITORING_INGEST_TOKEN: ${{ secrets.PRODUCTION_MONITORING_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/platform-monitoring.mjs probe

  staging-probe:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    name: Staging application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENVIRONMENT: staging
      APP_RELEASE: ${{ github.sha }}
      APP_BASE_URL: https://ethio-poultry-app-staging.walidmurad65.workers.dev
      MONITORING_INGEST_TOKEN: ${{ secrets.STAGING_MONITORING_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/platform-monitoring.mjs probe

  production-backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * *'
    name: Production backup status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENVIRONMENT: production
      APP_RELEASE: ${{ github.sha }}
      APP_BASE_URL: https://ethio-poultry-app.walidmurad65.workers.dev
      SUPABASE_PROJECT_REF: gnmeoxwqexennoidwwpf
      MONITORING_INGEST_TOKEN: ${{ secrets.PRODUCTION_MONITORING_INGEST_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_BACKUP_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/platform-monitoring.mjs backup

  staging-backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * *'
    name: Staging backup status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENVIRONMENT: staging
      APP_RELEASE: ${{ github.sha }}
      APP_BASE_URL: https://ethio-poultry-app-staging.walidmurad65.workers.dev
      SUPABASE_PROJECT_REF: uzmhpecehmlwojdmitgj
      MONITORING_INGEST_TOKEN: ${{ secrets.STAGING_MONITORING_INGEST_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_BACKUP_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node scripts/platform-monitoring.mjs backup
